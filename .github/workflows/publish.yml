name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "publish を --dry-run で実行する (npm には公開されない)"
        required: false
        default: false
        type: boolean

permissions:
  # OIDC のトークンを発行させるのに要る。これが無いと npm は資格情報を
  # 一つも見つけられず ENEEDAUTH で止まる。
  id-token: write
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted Publishing (OIDC) は npm 11.5.1 以降でしか動かない。
      # Node 22 に付いてくる npm は 10 系なので、24 にする。
      # 依存の解決は bun.lock があるので bun 側に任せる。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm supports trusted publishing
        run: |
          set -euo pipefail
          version=$(npm --version)
          required=11.5.1
          echo "npm $version"
          if [ "$(printf '%s\n%s\n' "$required" "$version" | sort -V | head -1)" != "$required" ]; then
            echo "::error::npm $version は Trusted Publishing (OIDC) 非対応です。$required 以上が要ります" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # タグから来た場合は package.json とタグがずれていないことを確認する。
          # ずれたまま公開すると、タグの指す中身と npm 上のバージョンが食い違う。
          if [ "${{ github.event_name }}" = "push" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::タグ ($GITHUB_REF_NAME) と package.json のバージョン ($version) が一致しません" >&2
              exit 1
            fi
          fi

      - name: Check if already published
        id: published
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version="${{ steps.version.outputs.version }}"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version は既に公開済みのためスキップします"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.already == 'false'
        run: |
          set -euo pipefail
          # トークンは渡さない。Trusted Publishing は OIDC で認証するので、
          # NODE_AUTH_TOKEN を置くと空の _authToken が優先されて ENEEDAUTH になる。
          # provenance も OIDC 経由なら自動で付くため --provenance は要らない。
          # --access public はスコープ付き (@metamoji/sdk) が既定で private
          # 扱いになるため。
          npm publish --access public ${{ inputs.dry_run && '--dry-run' || '' }}
